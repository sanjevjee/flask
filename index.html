<!DOCTYPE html>
<html>
<head>
    <title>EV Sales Predictor</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f0f0f0; }
        input, select { padding: 10px; margin: 5px; width: 250px; }
        input[type=submit] { background-color: #4CAF50; color: white; cursor: pointer; }
        .result { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Predict EV Sales Quantity</h2>
    <form method="post" action="/predict">
        <input type="number" name="Year" placeholder="Year" required><br>
        <input type="text" name="Month_Name" placeholder="Month Name (e.g., jan)" required><br>
        <input type="text" name="Date" placeholder="Date (e.g., 1/1/2014)" required><br>
        <input type="text" name="State" placeholder="State" required><br>
        <input type="text" name="Vehicle_Class" placeholder="Vehicle Class" required><br>
        <input type="text" name="Vehicle_Category" placeholder="Vehicle Category" required><br>
        <input type="text" name="Vehicle_Type" placeholder="Vehicle Type" required><br>
        <input type="submit" value="Predict">
    </form>
    <div class="result">{{ prediction_text }}</div>
</body>
</html>
